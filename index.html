  --ok:#86d0a6;--ok-soft:#15261c;--wait:#a9b7f0;--wait-soft:#191e33;--warn:#ee8f7d;--warn-soft:#2c1a17;
  --r:14px;--r-sm:10px;--r-xs:7px;
  --f:Nun,NSM,"Noto Sans Myanmar","Myanmar Text","Myanmar Sangam MN",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:NSM,"Noto Sans Myanmar","Myanmar Text","Myanmar Sangam MN",Nun,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f3ef;--bg-2:#ecece7;--surface:#ffffff;--surface-2:#f6f6f2;--surface-3:#ececE6;
  --ink:#151a17;--ink-2:#39433d;--ink-3:#5f6a63;--ink-4:#8a948d;
  --line:#d9dcd5;--line-2:#e8eae4;
  --brand:#1f6b52;--brand-ink:#ffffff;--brand-soft:#e3efe8;
  --p1:#a3402f;--p1-soft:#f8e7e2;--p2:#80571a;--p2-soft:#f6eddb;--p3:#2f5f80;--p3-soft:#e4edf4;
  --ok:#23683f;--ok-soft:#e2efe6;--wait:#3f4fa0;--wait-soft:#e7e9f6;--warn:#a3402f;--warn-soft:#f8e7e2;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--f);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
.lang-my{line-height:1.75}
.lang-my .t-my,.t-my{font-family:var(--fm)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- brand */
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.b-uni{font:900 22px/1 Nun,sans-serif;letter-spacing:-.03em;color:var(--brand)}
.b-bar{width:1px;height:22px;background:var(--line)}
.b-name{display:flex;flex-direction:column;line-height:1;min-width:0}
.b-name b{font:800 14px/1.1 Nun,sans-serif;white-space:nowrap}
.b-name small{margin-top:3px;font:800 9px/1 Nun,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid transparent;font:800 15px/1.2 var(--f);cursor:pointer;text-decoration:none;text-align:center}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:active{filter:brightness(.92)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-quiet{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn-danger{background:transparent;color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.btn-block{width:100%}
.btn-sm{min-height:38px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.inp{width:100%;min-height:48px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);outline:none;transition:border-color .15s,box-shadow .15s;font-size:16px}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent);background:var(--surface)}
.inp.bad{border-color:var(--warn)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.6}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.field{display:block;margin:0 0 14px}
.field>.lab{display:flex;justify-content:space-between;gap:8px;font:700 13px/1.5 var(--f);color:var(--ink-2);margin:0 0 6px}
.field>.lab em{font-style:normal;color:var(--warn);font-weight:800}
.field .err-t{color:var(--warn);font-size:12.5px;margin-top:5px;display:none}
.field.has-err .err-t{display:block}
.field.has-err .inp,.field.has-err .seg{border-color:var(--warn)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:42px;font:800 14px/1.2 var(--f);color:var(--ink-3);cursor:pointer;padding:4px 6px}
.seg button.on{background:var(--surface-3);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:11px;min-height:48px;padding:8px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);cursor:pointer;font-weight:700}
.opt input{width:20px;height:20px;accent-color:var(--brand);flex:none;margin:0}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt small{display:block;font-weight:600;color:var(--ink-3);font-size:12.5px}

/* ---------- gate + who */
.gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(14px,5vw,40px)}
.gate-card{width:min(100%,27rem);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,5vw,34px)}
.gate-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.gate h1{font:900 clamp(1.6rem,6vw,2rem)/1.2 var(--f);margin:0 0 6px;letter-spacing:-.03em}
.lang-my .gate h1{letter-spacing:0;line-height:1.5}
.gate .sub{margin:0 0 22px;color:var(--ink-3);font-size:14px}
.err{color:var(--warn);font-size:14px;margin:10px 0 0}
.err:empty{display:none}
.note{font-size:13.5px;color:var(--ink-3);margin:16px 0 0;line-height:1.7}
.who-grp{margin:22px 0 0}
.who-grp h2{font:800 12px/1.4 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.lang-my .who-grp h2{letter-spacing:0;text-transform:none;font-size:13px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.person{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left}
.person:hover{border-color:var(--ink-4)}
.person b{display:block;font-weight:800;font-size:14.5px;line-height:1.25}
.person small{display:block;color:var(--ink-3);font-size:12px;line-height:1.35}
.ava{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:900 12.5px/1 Nun,sans-serif;background:var(--surface-3);color:var(--ink-2);letter-spacing:.02em}
.ava.sales{background:var(--p2-soft);color:var(--p2)}.ava.service{background:var(--p3-soft);color:var(--p3)}.ava.mgr{background:var(--brand-soft);color:var(--brand)}
.pin{display:flex;gap:10px;justify-content:center;margin:18px 0}
.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-3)}
.pin i.on{background:var(--brand);border-color:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:auto}
.pad button{min-height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font:800 22px/1 Nun,sans-serif;cursor:pointer}
.pad button.fn{font-size:14px;color:var(--ink-3)}

/* ---------- chrome */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid var(--line-2)}
.top-in{max-width:960px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;min-height:60px}
.top-r{display:flex;align-items:center;gap:6px}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px 4px 4px;cursor:pointer;min-height:40px}
.me .ava{width:30px;height:30px;font-size:11px}
.me span{font:800 13px/1.1 var(--f);max-width:9.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-pill{border:1px dashed color-mix(in srgb,var(--p2) 60%,transparent);color:var(--p2);background:transparent;border-radius:99px;padding:0 11px;min-height:34px;font:800 12px/1 var(--f);cursor:pointer;letter-spacing:.04em}
.review-bar{background:var(--p2-soft);color:var(--p2);font:700 12.5px/1.5 var(--f);text-align:center;padding:5px 12px;border-bottom:1px solid color-mix(in srgb,var(--p2) 25%,transparent)}
main{max-width:960px;margin:auto;padding:18px 14px calc(104px + var(--safe-b))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line-2);padding:6px 8px calc(6px + var(--safe-b))}
.nav-in{max-width:560px;margin:auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;text-decoration:none;color:var(--ink-3);font:800 11px/1.2 var(--f);border-radius:12px;text-align:center}
.lang-my .nav a{font-size:10.5px}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--brand);background:var(--brand-soft)}
.nav .dot{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font:900 10.5px/18px Nun,sans-serif}

/* ---------- page header */
.ph{margin:4px 2px 18px}
.ph .eyebrow{font:800 12px/1.4 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.lang-my .ph .eyebrow{letter-spacing:0;text-transform:none;font-size:13px}
.ph h1{font:900 clamp(1.6rem,5.5vw,2.15rem)/1.2 var(--f);letter-spacing:-.03em;margin:0}
.lang-my .ph h1{letter-spacing:0;line-height:1.5;font-size:clamp(1.35rem,5vw,1.8rem)}
.ph p{margin:6px 0 0;color:var(--ink-3);font-size:14px}
.period-pick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 16px;padding:2px}
.period-pick::-webkit-scrollbar{display:none}
.pp{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:10px;padding:7px 12px;font:800 13px/1.3 var(--f);cursor:pointer;text-align:left}
.pp small{display:block;font-weight:700;font-size:11px;color:var(--ink-3)}
.pp.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.pp.on small{color:var(--brand)}

/* ---------- blocks */
.box{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:clamp(14px,3.5vw,20px);margin:0 0 12px}
.box>h2,.sec-h{font:800 13px/1.4 var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lang-my .box>h2,.lang-my .sec-h{letter-spacing:0;text-transform:none;font-size:14px}
.sec-h{margin:22px 4px 10px}
.sec-h .n{font:900 12px/1 Nun,sans-serif;color:var(--ink-2);background:var(--surface-3);border-radius:99px;padding:4px 8px;letter-spacing:0}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* ---------- progress hero */
.prog{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring{position:relative;width:92px;height:92px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 22px/1 Nun,sans-serif;letter-spacing:-.02em}
.ring b small{font:700 11px/1.3 var(--f);color:var(--ink-3);margin-top:4px;letter-spacing:0}
.stack{height:10px;border-radius:99px;background:var(--surface-3);display:flex;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.stack .s-ok{background:var(--ok)}.stack .s-wait{background:var(--wait)}.stack .s-ret{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font:700 12.5px/1.4 var(--f);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;background:var(--surface-3);border:1px solid var(--line)}
.legend .l-ok{background:var(--ok);border:0}.legend .l-wait{background:var(--wait);border:0}.legend .l-ret{background:var(--warn);border:0}
.legend b{font-weight:900;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.kpi{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:12px 12px 10px;min-width:0}
.kpi b{display:block;font:900 clamp(1.4rem,5vw,1.9rem)/1.1 Nun,sans-serif;letter-spacing:-.02em}
.kpi span{display:block;font:700 12px/1.4 var(--f);color:var(--ink-3);margin-top:3px}
.kpi.ok b{color:var(--ok)}.kpi.wait b{color:var(--wait)}.kpi.ret b{color:var(--warn)}

/* ---------- task rows */
.list{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px 13px 0;border-top:1px solid var(--line-2);text-decoration:none;color:inherit;min-height:72px}
.row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
@media (hover:hover){.row:hover{background:var(--surface-2)}}
.row .rail{align-self:stretch;border-radius:0 3px 3px 0;background:var(--pc,var(--line))}
.row .nm{display:block;font:800 15.5px/1.35 var(--f);overflow-wrap:anywhere}
.row .sub{display:flex;flex-wrap:wrap;gap:4px 10px;font:600 12.5px/1.5 var(--f);color:var(--ink-3);margin-top:3px}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.row .due{font:700 12px/1.3 var(--f);color:var(--ink-3)}
.row .due.late{color:var(--warn)}
.P1{--pc:var(--p1);--ps:var(--p1-soft)}.P2{--pc:var(--p2);--ps:var(--p2-soft)}.P3{--pc:var(--p3);--ps:var(--p3-soft)}
.tag{display:inline-flex;align-items:center;gap:5px;font:800 11.5px/1 var(--f);padding:5px 8px;border-radius:7px;white-space:nowrap}
.tag.p{color:var(--pc);background:var(--ps)}
.tag.m{color:var(--ink-2);background:var(--surface-3)}
.st{display:inline-flex;align-items:center;gap:6px;font:800 12px/1.2 var(--f);padding:5px 9px;border-radius:99px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.st-open{--c:var(--ink-3)}.st-submitted{--c:var(--wait)}.st-returned{--c:var(--warn)}.st-confirmed{--c:var(--ok)}.st-none{--c:var(--ink-4)}
.cs{display:inline-block;font:800 11.5px/1.5 var(--f);color:var(--c)}
.lang-my .cs{font-family:var(--fm);font-weight:700;font-size:12px;line-height:1.8}
.cs-Lost{--c:var(--ink-3)}.cs-Urgent,.cs-Declining,.cs-Recent-drop{--c:var(--p1)}.cs-Watch{--c:var(--p2)}.cs-New{--c:var(--p3)}.cs-Stable,.cs-Growing{--c:var(--ok)}.cs-No-reagent-yet{--c:#c7a6e2}
.empty{padding:30px 18px;text-align:center;color:var(--ink-3);font-size:14.5px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- search & chips */
.tools{position:sticky;top:61px;z-index:20;background:var(--bg);padding:4px 0 10px;display:flex;flex-direction:column;gap:8px}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2}
.search .inp{padding-left:40px;background:var(--surface)}
.search .hint-a{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:800 11.5px/1 var(--f);color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:5px 7px;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:9px;padding:0 12px;min-height:38px;font:800 13px/1 var(--f);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.chip .c{font-weight:900;color:var(--ink-3)}
.chip.on .c{color:var(--brand)}
.count{font:700 12.5px/1 var(--f);color:var(--ink-3);margin:4px 4px 10px}

/* ---------- card */
.back{display:inline-flex;align-items:center;gap:6px;font:800 14px/1 var(--f);color:var(--brand);text-decoration:none;padding:6px 2px 14px;background:none;border:0;cursor:pointer}
.hero{position:relative;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:clamp(16px,4vw,24px);overflow:hidden;margin:0 0 12px}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--pc)}
.hero .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hero h1{font:900 clamp(1.35rem,5.5vw,1.85rem)/1.25 var(--f);letter-spacing:-.02em;margin:12px 0 4px;overflow-wrap:anywhere}
.hero .meta{color:var(--ink-3);font-size:14px;margin:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 0}
.fact{background:var(--surface-2);border-radius:10px;padding:10px 11px;min-width:0}
.fact span{display:block;font-size:12px;line-height:1.5;color:var(--ink-3)}
.fact b{display:block;font:900 16.5px/1.35 var(--f);margin-top:3px;overflow-wrap:anywhere}
.task{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:13px 15px;margin:0 0 12px;border:1px solid var(--line-2);background:var(--surface)}
.task .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3)}
.task .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.task b{display:block;font-weight:800}
.task p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.task.returned{border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:var(--warn-soft)}
.task.returned .ic{color:var(--warn)}
.task.submitted .ic{color:var(--wait)}.task.confirmed .ic{color:var(--ok)}.task.open .ic{color:var(--brand)}
.do{border:1px solid var(--line-2);border-left:3px solid var(--brand);background:var(--surface);border-radius:4px 14px 14px 4px;padding:15px 17px;margin:0 0 12px}
.do h2{font:800 12.5px/1.4 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin:0 0 6px}
.lang-my .do h2{letter-spacing:0;text-transform:none;font-size:14px}
.do p{margin:0;font-size:16.5px;font-weight:700;line-height:1.65}
.lang-my .do p{font-family:var(--fm);line-height:1.95}
.why p{margin:0;line-height:1.75;color:var(--ink-2)}
.lang-my .why p{font-family:var(--fm);line-height:1.95}
details.more{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);margin:0 0 12px}
details.more>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 18px;font:800 14px/1.4 var(--f)}
details.more>summary::-webkit-details-marker{display:none}
details.more>.in{padding:0 18px 18px}

}
function open(d){document.getElementById('gate').remove();document.getElementById('app').classList.remove('hidden');window.UNI_START(d,lang);}
var saved=null;try{saved=JSON.parse(localStorage.getItem(window.UNI_PWKEY));}catch(x){}
if(saved&&saved.p){unlock(saved.u||'UNi',saved.p).then(open).catch(function(){try{localStorage.removeItem(window.UNI_PWKEY);}catch(x){}});}
var f=document.getElementById('gform'),e=document.getElementById('ge'),b=document.getElementById('gb');
f.addEventListener('submit',function(ev){ev.preventDefault();e.textContent='';b.disabled=true;b.textContent=LOGIN[lang].opening;
  var u=document.getElementById('gu').value.trim()||'UNi',p=document.getElementById('gp').value;
  unlock(u,p).then(function(d){try{localStorage.setItem(window.UNI_PWKEY,JSON.stringify({u:u,p:p}));}catch(x){}open(d);})
  .catch(function(x){b.disabled=false;b.textContent=LOGIN[lang].open;e.textContent=x&&x.message==='nocrypto'?LOGIN[lang].nocrypto:LOGIN[lang].bad;});
});
})();
</script>
