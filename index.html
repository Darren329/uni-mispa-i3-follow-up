<!DOCTYPE html>
<html lang="my"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light"><meta name="theme-color" content="#000000">
<script>
(function () {
  'use strict';
  const key = 'uni-fu:appearance';
  const root = document.documentElement;
  const preference = window.matchMedia('(prefers-color-scheme: light)');
  let mode = 'dark';
  try { if (localStorage.getItem(key) === 'system') mode = 'system'; } catch (_) {}
  const labels = {
    en: {appearance: 'Appearance', dark: 'Dark', system: 'Use device'},
    my: {appearance: 'မျက်နှာပြင်ပုံစံ', dark: 'အမှောင်ပုံစံ', system: 'ဖုန်းစနစ်အတိုင်း'}
  };
  function refresh() {
    const light = mode === 'system' && preference.matches;
    root.dataset.theme = light ? 'light' : 'dark';
    document.querySelector('meta[name="theme-color"]').content = light ? '#f4f5f1' : '#000000';
    const text = labels[root.lang] || labels.en;
    document.querySelectorAll('[data-appearance-label]').forEach(function (node) {
      node.textContent = text[node.dataset.appearanceLabel];
    });
    document.querySelectorAll('[data-mode]').forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
    });
    const trigger = document.querySelector('.appearance-menu summary');
    if (trigger) {
      trigger.setAttribute('aria-label', text.appearance + ' · ' + text[mode]);
      trigger.title = text.appearance;
    }
  }
  function closeMenu(menu) {
    menu.open = false;
    menu.querySelector('summary').focus();
  }
  refresh();
  document.addEventListener('DOMContentLoaded', refresh);
  new MutationObserver(refresh).observe(root, {attributes:true, attributeFilter:['lang']});
  if (preference.addEventListener) preference.addEventListener('change', refresh);
  else preference.addListener(refresh);
  document.addEventListener('click', function (event) {
    const menu = document.querySelector('.appearance-menu[open]');
    const button = event.target.closest('[data-mode]');
    if (button) {
      mode = button.dataset.mode;
      try { localStorage.setItem(key, mode); } catch (_) {}
      refresh();
      if (menu && menu.contains(button)) closeMenu(menu);
    } else if (menu && !menu.contains(event.target)) menu.open = false;
  });
  document.addEventListener('keydown', function (event) {
    const menu = document.querySelector('.appearance-menu[open]');
    if (event.key === 'Escape' && menu) closeMenu(menu);
  });
})();
</script>

  --bg:#F4F6F8;--surface:#FFFFFF;--surface-2:#F8FAFB;--ink:#0F1E24;--ink-2:#41535A;--ink-3:#71838A;--line:#E3E9EC;--line-2:#EEF2F4;
  --brand:#14808C;--brand-2:#1E93A1;--brand-soft:#E4F3F4;--leaf:#4DAF7C;--lime:#A3CB3C;
  --p1:#D9473C;--p1-soft:#FCEDEB;--p2:#D9822B;--p2-soft:#FCF2E6;--p3:#2F7FC4;--p3-soft:#E8F1FA;
  --good:#2E9A5E;--good-soft:#E6F4EC;
  --r:14px;--r-sm:10px;--shadow:0 1px 2px rgba(15,30,36,.04),0 4px 14px rgba(15,30,36,.05);
  --f:Nun,NSM,"Noto Sans Myanmar","Myanmar Text","Myanmar Sangam MN",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f);-webkit-tap-highlight-color:transparent;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.my{font-family:NSM,"Noto Sans Myanmar","Myanmar Text","Myanmar Sangam MN",Nun,sans-serif;line-height:1.95}
.hidden{display:none!important}
/* ---------- login */
.gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px 22px;box-shadow:var(--shadow)}
.gate h1{font:900 22px/1.25 Nun,sans-serif;margin:18px 0 4px;letter-spacing:-.01em}
.gate p.sub{margin:0 0 20px;color:var(--ink-3);font-size:14px}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font:700 12.5px/1.4 Nun,sans-serif;color:var(--ink-2);margin:0 0 6px;letter-spacing:.01em}
.field>span .my{font-weight:600;font-size:12.5px}
.inp{width:100%;min-height:46px;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent);background:var(--surface)}
textarea.inp{min-height:84px;resize:vertical;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid transparent;font:800 15px/1 Nun,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:active{filter:brightness(.92)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-block{width:100%}
.err{color:var(--p1);font-size:13.5px;min-height:20px;margin:8px 0 0}
.note{font-size:12.5px;color:var(--ink-3);margin:14px 0 0;line-height:1.55}
/* ---------- brand */
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.b-uni{font:900 24px/1 Nun,sans-serif;letter-spacing:-.03em;background:linear-gradient(115deg,#1E93A1 0%,#2AA7B5 40%,#4DAF7C 75%,#7DB83A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.b-dot{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px color-mix(in srgb,#A3CB3C 22%,transparent)}
.b-name{display:flex;flex-direction:column;line-height:1}
.b-name b{font:900 15.5px/1 Nun,sans-serif;color:var(--ink)}
.b-name small{margin-top:3px;font:800 9px/1 Nun,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--brand)}
.stripe{display:flex;height:3px}.stripe i{flex:1}.stripe i:nth-child(1){background:#1E93A1}.stripe i:nth-child(2){background:#2AA7B5}.stripe i:nth-child(3){background:#4DAF7C}.stripe i:nth-child(4){background:#A3CB3C}
/* ---------- app chrome */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;min-height:56px}
.ed{font:700 11.5px/1.3 Nun,sans-serif;color:var(--ink-3);text-align:right}
.ed b{display:block;color:var(--ink);font-size:12.5px}
main{max-width:880px;margin:auto;padding:16px 14px calc(96px + var(--safe-b))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b))}
.nav-in{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;text-decoration:none;color:var(--ink-3);font:800 11px/1 Nun,sans-serif;letter-spacing:.02em;border-radius:10px}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--brand)}
.nav a .badge{position:absolute;margin-left:22px;margin-top:-4px;background:var(--p1);color:#fff;border-radius:9px;font-size:10px;padding:2px 5px}
/* ---------- home */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 2px 14px}
.hello h1{font:900 23px/1.2 Nun,sans-serif;margin:0;letter-spacing:-.015em}
.hello p{margin:3px 0 0;color:var(--ink-3);font-size:13.5px}
.ring{flex:none;position:relative;width:62px;height:62px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 15px/1 Nun,sans-serif}
.ring b small{font:700 9.5px/1.2 Nun,sans-serif;color:var(--ink-3);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 11px;box-shadow:var(--shadow);text-align:left;cursor:pointer;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.kpi.on{outline:2px solid var(--pc);outline-offset:-1px}
.kpi .k-top{display:flex;justify-content:space-between;align-items:center}
.pill-p{font:900 11px/1 Nun,sans-serif;color:var(--pc);background:var(--ps);border-radius:6px;padding:4px 7px}
.kpi .k-n{font:900 28px/1.1 Nun,sans-serif;margin:8px 0 2px;letter-spacing:-.02em}
.kpi .k-l{font:700 11.5px/1.35 Nun,sans-serif;color:var(--ink-3)}
.kpi .bar{height:5px;border-radius:9px;background:var(--line-2);margin-top:9px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--pc);border-radius:9px;transition:width .4s}
.P1{--pc:var(--p1);--ps:var(--p1-soft)}.P2{--pc:var(--p2);--ps:var(--p2-soft)}.P3{--pc:var(--p3);--ps:var(--p3-soft)}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin:0 0 14px;box-shadow:var(--shadow)}
.brief summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;font:800 13.5px/1.4 Nun,sans-serif}
.brief summary::-webkit-details-marker{display:none}
.brief .my{font-size:14px;color:var(--ink-2);margin:10px 0 0}
.chev{flex:none;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details[open]>summary .chev{transform:rotate(-135deg)}
.tools{position:sticky;top:57px;z-index:20;background:var(--bg);padding:6px 0 10px;display:flex;flex-direction:column;gap:8px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2}
.search .inp{padding-left:38px;background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:6px 12px;font:800 12.5px/1 Nun,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.count{font:700 12px/1 Nun,sans-serif;color:var(--ink-3);margin:2px 4px 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.grp-h{display:flex;align-items:center;gap:8px;margin:18px 4px 8px;font:800 12px/1.3 Nun,sans-serif;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.grp-h .my{text-transform:none;letter-spacing:0;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line-2);text-decoration:none;color:inherit;min-height:66px}
.row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.av{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:900 13px/1 Nun,sans-serif;color:var(--pc);background:var(--ps)}
.r-main{min-width:0}
.r-main{display:block}.r-name{display:block;font:800 14.5px/1.3 Nun,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-sub{display:flex;font:600 12px/1.4 Nun,sans-serif;color:var(--ink-3);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.r-end{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.st{display:inline-flex;align-items:center;gap:5px;font:800 11px/1 Nun,sans-serif;padding:4px 8px;border-radius:6px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.s-Lost{--c:#5B6B72}.s-Urgent{--c:#D9473C}.s-Watch{--c:#C98A12}.s-Declining{--c:#D46A1F}.s-Recent-drop{--c:#D46A1F}.s-New{--c:#2F7FC4}.s-Stable{--c:#2E9A5E}.s-Growing{--c:#2E9A5E}.s-No-reagent-yet{--c:#7B57C2}
.marks{display:flex;gap:4px}
.mk{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);color:var(--ink-3)}
.mk svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mk.done{border:0;background:var(--good);color:#fff}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:14px}
/* ---------- card */
.back{display:inline-flex;align-items:center;gap:6px;font:800 13.5px/1 Nun,sans-serif;color:var(--brand);text-decoration:none;padding:8px 2px 12px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--pc)}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.h-do{display:flex;gap:9px;align-items:flex-start;margin:10px 0 0;padding:0 0 12px;border-bottom:1px dashed var(--line);font-size:13px;color:var(--ink-2)}
.hero h2{font:900 21px/1.3 Nun,sans-serif;margin:12px 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}
.h-meta{font-size:13px;color:var(--ink-3);margin:0}
.h-st{margin:10px 0 0}
.h-st .st{font-size:12px;padding:5px 9px}
.h-st .my{font-size:13px;color:var(--ink-2);margin-left:4px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
.fact{background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:9px 10px;min-width:0}
.fact span{display:block;font-size:11.5px;line-height:1.55;color:var(--ink-3)}
.fact b{display:block;font:900 17px/1.3 Nun,NSM,sans-serif;margin-top:3px;overflow-wrap:anywhere}
.tabs{position:sticky;top:57px;z-index:15;background:var(--bg);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:12px 0 10px}
.tabs a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border-radius:11px;font:800 13px/1 Nun,sans-serif;color:var(--ink-2);text-decoration:none;background:var(--surface);border:1px solid var(--line)}
.tabs a.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tabs a i{width:7px;height:7px;border-radius:50%;background:var(--good);display:none}
.tabs a.sent i{display:inline-block}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 10px;box-shadow:var(--shadow)}
.sec h3{font:900 13px/1.4 Nun,NSM,sans-serif;margin:0 0 6px;color:var(--ink-2);letter-spacing:.01em}
.sec h3.my{font-weight:700;font-size:14px}
.sec .my{font-size:15px}
.act{border:1.5px solid var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--surface))}
.act h3{color:var(--brand);display:flex;align-items:center;gap:8px}
.act h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.act .my{font-weight:600;color:var(--ink)}
.trend{display:grid;gap:9px;margin:6px 0 4px}
.tr .tl{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-3)}
.tr .tl b{font:900 15.5px/1.4 Nun,sans-serif;color:var(--ink)}
.tr .tt{height:9px;border-radius:9px;background:var(--line-2);overflow:hidden;margin-top:3px}
.tr .tt i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--brand-2),var(--leaf))}
.spark{margin:14px 0 2px}
.spark-h{display:flex;justify-content:space-between;font:700 11.5px/1.3 Nun,sans-serif;color:var(--ink-3);margin-bottom:6px}
.cols{display:flex;align-items:flex-end;gap:2px;height:76px;border-bottom:1px solid var(--line)}
.cols i{flex:1;background:var(--line);border-radius:3px 3px 0 0;min-height:1px;position:relative}
.cols i.l12{background:color-mix(in srgb,var(--brand) 55%,var(--surface))}
.cols i.l3{background:var(--brand)}
.cols-x{display:flex;justify-content:space-between;font:700 10.5px/1.3 Nun,sans-serif;color:var(--ink-3);margin-top:4px}
.legend{display:flex;gap:12px;font:700 11px/1 Nun,sans-serif;color:var(--ink-3);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.items{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.items th{font:800 11px/1.3 Nun,sans-serif;color:var(--ink-3);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.items td{padding:8px 4px;border-bottom:1px solid var(--line-2)}
.items td.n{text-align:right;font-weight:800}
.items th.n{text-align:right}
.tag{font:800 10px/1 Nun,sans-serif;color:var(--p1);background:var(--p1-soft);border-radius:5px;padding:3px 5px;margin-left:6px;vertical-align:1px}
/* forms */
.who{display:grid;gap:8px}
.who-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:6px 0 2px}
.who-h b{font-size:14px}
.who-h small{font:700 11px/1.3 Nun,sans-serif;color:var(--ink-3)}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;font:800 13px/1 Nun,sans-serif;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.check{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);cursor:pointer;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--good)}
.sendbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:6px}
.sent-note{display:flex;align-items:center;gap:8px;font:700 12.5px/1.4 Nun,sans-serif;color:var(--good);margin:10px 2px 0}
.hint{font:600 12px/1.5 Nun,sans-serif;color:var(--ink-3);margin:4px 2px 0}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.pn a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font:800 13.5px/1 Nun,sans-serif;color:var(--ink-2)}
.pn span{visibility:hidden}
/* report + guide */
.page-h{font:900 22px/1.25 Nun,sans-serif;margin:6px 2px 4px;letter-spacing:-.01em}
.page-sub{color:var(--ink-3);font-size:13.5px;margin:0 2px 14px}
.rep-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.rep-row:first-of-type{border-top:0}
.rep-row b{font-weight:800}
.guide h4{font:700 14.5px/1.6 NSM,Nun,sans-serif;margin:14px 0 2px}
.guide .pri{border-left:4px solid var(--pc);padding:8px 12px;background:var(--surface-2);border-radius:0 10px 10px 0;margin:10px 0}
.instr{border-left:4px solid var(--leaf);background:color-mix(in srgb,var(--leaf) 8%,var(--surface));padding:10px 13px;border-radius:0 10px 10px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font:800 13.5px/1.3 Nun,sans-serif;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:640px){main{padding:22px 22px 110px}.kpis{gap:12px}.facts{gap:10px}.hero h2{font-size:24px}}
@media (max-width:370px){.grid3{grid-template-columns:1fr 1fr}.grid3 .inp:first-child{grid-column:1/-1}.kpi .k-n{font-size:24px}.facts{grid-template-columns:1fr 1fr}.fact:last-child{grid-column:1/-1}}
@media print{.top,.nav,.tools,.tabs,.sendbar,.toast{display:none!important}body{background:#fff}.sec,.hero,.list{box-shadow:none}}
.btn.busy{opacity:.6;pointer-events:none}
/* language */
.lang-sw{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.lang-sw button{border:0;background:none;border-radius:8px;padding:5px 9px;font:800 12px/1 Nun,NSM,sans-serif;color:var(--ink-3);cursor:pointer;min-height:28px}
.lang-sw button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.gate-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top-r{display:flex;align-items:center;gap:10px}
.txt{line-height:1.7}
.txt.body{font-size:15px}
.small2{font-size:14px;color:var(--ink-2)}
.lang-my{line-height:1.8}
.lang-my .txt,.lang-my .h-do,.lang-my .fact span,.lang-my .tr .tl span,.lang-my .who-h b,.lang-my .field>span,.lang-my .page-sub,.lang-my .hint,.lang-my .guide h4{font-family:NSM,"Noto Sans Myanmar","Myanmar Text","Myanmar Sangam MN",Nun,sans-serif;line-height:1.95}
.lang-my .k-l,.lang-my .chip,.lang-my .tabs a,.lang-my .nav a,.lang-my .seg button,.lang-my .btn,.lang-my .sec h3,.lang-my .hello h1,.lang-my .page-h,.lang-my .r-sub,.lang-my .count,.lang-my .brief summary,.lang-my .items th,.lang-my .legend,.lang-my .spark-h,.lang-my .check,.lang-my .rep-row,.lang-my .back,.lang-my .gate h1,.lang-my .err,.lang-my .note,.lang-my .sent-note,.lang-my .toast{font-family:Nun,NSM,"Noto Sans Myanmar",sans-serif;line-height:1.6}
.lang-my .hello h1,.lang-my .page-h{font-size:20px;line-height:1.5}
.lang-my .tabs a{font-size:12.5px}
.lang-my .nav a{font-size:10.5px;text-align:center}
.lang-my .k-l{font-size:11px}
.lang-my .ed{display:none}
@media (min-width:480px){.lang-my .ed{display:block}}
.sec h3{text-transform:none}
.who-h small{text-align:right}
.sent-note span{line-height:1.5}
.lang-my .h-st .st{font:700 13px/1.7 NSM,"Noto Sans Myanmar",Nun,sans-serif;letter-spacing:0;padding:3px 10px}
.ed{display:none}
@media (min-width:520px){.ed{display:block}.lang-my .ed{display:block}}
.lang-my .r-sub{font-family:NSM,Nun,sans-serif}
/* Surfaces, typography and controls shared by both languages. */
:root {
  --bg: #000; --surface: #121514; --surface-2: #1a1e1c;
  --ink: #f2f4ef; --ink-2: #cbd2cb; --ink-3: #a4afa7;
  --line: #373d39; --line-2: #292f2b;
  --brand: #94d6bd; --brand-2: #6ab9a5; --brand-soft: #20362c;
  --leaf: #91cfad; --good: #8ad3ac; --good-soft: #20352b;
  --p1: #f19b89; --p1-soft: #3b2521; --p2: #e5bf79; --p2-soft: #362e20;
  --p3: #9ebed6; --p3-soft: #202f3b; --button-ink: #10231a;
  --r: 12px; --r-sm: 8px; --shadow: none; color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f5f1; --surface: #fff; --surface-2: #f0f3ee;
  --ink: #18231b; --ink-2: #35473c; --ink-3: #57675c;
  --line: #cbd3ca; --line-2: #e0e5de;
  --brand: #21664d; --brand-2: #36745f; --brand-soft: #e1eee5;
  --leaf: #36734f; --good: #24663f; --good-soft: #e2efe6;
  --p1: #943b2a; --p1-soft: #f8e8e2; --p2: #78521b; --p2-soft: #f5ecda;
  --p3: #385f7c; --p3-soft: #e5eef3; --button-ink: white; color-scheme: light;
}
html {background: var(--bg)}
body {font-size: 1rem}
.stripe {display:none}
.brand {gap:9px}
.b-uni {color:var(--brand);background:none;-webkit-text-fill-color:currentColor}
.b-dot {width:1px;height:23px;background:var(--line);border-radius:0;box-shadow:none}
.b-name small {font-size:9px;letter-spacing:.12em;color:var(--ink-3)}
.gate {padding:clamp(12px,4vw,36px);min-height:100vh;min-height:100svh}
.gate-card {position:relative;isolation:isolate;width:min(100%,29rem);max-width:none;
  padding:clamp(18px,5vw,36px);border-radius:16px;box-shadow:0 12px 44px #0002}
.gate-top {position:relative;margin:0 0 28px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.gate-card::before {content:"";position:absolute;z-index:-1;pointer-events:none;right:0;top:0;
  width:47%;height:9rem;border-radius:0 16px 0 0;opacity:.42;
  background:repeating-radial-gradient(ellipse at 110% -80%,transparent 0 12px,var(--line) 13px,transparent 14px 18px);
  mask-image:linear-gradient(220deg,#000,transparent 79%)}
.gate h1 {font-size:clamp(1.75rem,5vw,2.15rem);margin:0 0 5px;letter-spacing:-.032em}
.gate .sub {margin:0 0 24px;line-height:1.65;color:var(--ink-2)}
.field {margin-bottom:14px}
.field>span,.field>span .my {font-size:.875rem}
.inp {min-height:48px;font-size:1rem;border-radius:8px}
.btn {border-radius:8px;min-height:48px}
.btn-primary,.mk.done {color:var(--button-ink)}
.btn-primary svg {stroke:currentColor!important}
.err:empty {display:none}
.gate .note {font-size:.875rem;line-height:1.7;margin:16px 0 0}
.gate-appearance {border-top:1px solid var(--line);padding-top:16px;margin-top:20px}
.theme-label {font-size:.875rem;font-weight:700;margin:0 0 7px;color:var(--ink-2)}
.theme-options {display:grid;grid-template-columns:1fr 1fr;gap:4px;border:1px solid var(--line);
  border-radius:9px;padding:3px;background:var(--bg)}
.theme-options button {cursor:pointer;background:transparent;border:1px solid transparent;border-radius:6px;
  color:var(--ink-2);min-height:44px;line-height:1.55;font-weight:700;font-size:.875rem;display:flex;
  gap:7px;align-items:center;justify-content:center;padding:5px 7px}
.theme-options button[aria-pressed="true"] {border-color:var(--line);background:var(--surface-2);color:var(--brand)}
.appearance-icon {display:inline-flex;flex:none}
.appearance-icon svg {width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.appearance-menu {position:relative}
.appearance-menu summary {cursor:pointer;list-style:none;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--brand)}
.appearance-menu summary::-webkit-details-marker {display:none}
.appearance-panel {position:absolute;right:0;top:calc(100% + 8px);width:min(18rem,calc(100vw - 24px));
  padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 22px #0003}
.lang-sw {border-radius:8px;gap:0}
.lang-sw button {min-height:38px;min-width:40px;padding:3px 6px;border-radius:5px;line-height:1.6}
.top-r {gap:6px}
.top-in {min-height:60px}
.tools,.tabs {top:61px}
.hello {align-items:center;margin:8px 0 18px;padding:0 0 18px;border-bottom:1px solid var(--line)}
.hello h1,.page-h {font-size:clamp(1.65rem,4vw,2.15rem);letter-spacing:-.035em}
.hello p,.page-sub,.h-meta {font-size:.875rem;color:var(--ink-2)}
.kpis {gap:8px}
.kpi {padding:12px 10px;border-radius:10px}
.kpi::before {top:0;right:0;bottom:auto;width:auto;height:2px}
.kpi .k-n {font-size:clamp(1.75rem,5vw,2.3rem);font-variant-numeric:tabular-nums}
.kpi .k-l,.lang-my .k-l {font-size:.79rem;line-height:1.65}
.kpi .bar {height:3px}
.pill-p {border-radius:4px;font-size:.75rem}
.brief,.hero,.sec,.list {border-radius:12px}
.sec,.hero {padding:clamp(14px,3vw,22px)}
.hero::before {height:2px}
.act {border:1px solid var(--line);border-inline-start:3px solid var(--brand)}
.sec h3,.sec h3.my {font-size:1rem;color:var(--ink)}
.txt.body,.sec .my {font-size:1rem}
.fact {border-radius:8px}
.fact span,.r-sub,.count,.grp-h,.legend {font-size:.8rem}
.chip {min-height:40px;border-radius:8px;padding:6px 12px}
.chip.on,.tabs a.on {color:var(--brand);background:var(--brand-soft);border-color:var(--brand)}
.tabs a,.seg button {border-radius:7px;min-height:44px}
.row {grid-template-columns:32px minmax(0,1fr) auto;gap:10px;min-height:76px}
.av {width:32px;height:32px;background:transparent;border:1px solid var(--line);border-radius:6px}
.r-name {font-size:1rem;white-space:normal;overflow-wrap:anywhere}
.st {font-size:.75rem;line-height:1.3}
.s-Lost {--c:var(--ink-2)} .s-Urgent {--c:var(--p1)} .s-Watch {--c:var(--p2)}
.s-Declining,.s-Recent-drop {--c:var(--p1)} .s-New {--c:var(--p3)}
.s-Stable,.s-Growing {--c:var(--good)} .s-No-reagent-yet {--c:#cfade7}
[data-theme="light"] .s-No-reagent-yet {--c:#70408e}
.nav a {border-radius:8px;min-height:48px}
.nav a.on {background:var(--brand-soft);color:var(--brand)}
:focus-visible {outline:2px solid var(--brand);outline-offset:2px}
@media (hover:hover) {
  .row:hover,.btn-ghost:hover,.theme-options button:hover {background:var(--surface-2)}
  .kpi:hover,.chip:hover,.pn a:hover {border-color:var(--ink-3)}
}
@media (min-width:640px) {
  .sec,.list,.kpis,.brief {margin-bottom:16px}
  main {padding-top:30px}
  .kpi {padding:16px 20px}
}
@media (max-width:480px) {
  .ed,.lang-my .ed {display:none}
  .grid3 {grid-template-columns:1fr 1fr}

function setNav(k) { $$('.nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.k === k); }); }

function route(keep) {

  if (parts[0] === 'c' && BY_NO[parts[1]]) { var c = BY_NO[parts[1]]; html = parts[2] === 'sales' ? viewSales(c) : parts[2] === 'service' ? viewService(c) : viewCard(c); }

  window.addEventListener('online', flushQueue);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) flushQueue(); });
  route(); setTimeout(flushQueue, 1500);
};
})();
